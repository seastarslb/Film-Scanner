<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Vinyl Film Inventory</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #eef0ea;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

<iframe
  id="appFrame"
  title="Vinyl Film Inventory"
  allow="camera; microphone"
></iframe>

<script>
  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbylHdQP6cQhUuSFUFc-hwBCTR0XV5OTW8P52ZB1MsKgzoNKKqCHm4q-ykiqJMcDt1oyfQ/exec";

  const params = new URLSearchParams(window.location.search);

  const appUrl = new URL(APPS_SCRIPT_URL);

  // Preserve QR/scanner parameters.
  const film = params.get("film");
  const scan = params.get("scan");

  if (film) {
    appUrl.searchParams.set("film", film);
  }

  if (scan) {
    appUrl.searchParams.set("scan", scan);
  }

  document.getElementById("appFrame").src = appUrl.toString();
</script>

</body>
</html>
